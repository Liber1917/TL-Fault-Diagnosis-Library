[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tl-fault-diagnosis-library"
version = "2.0.0"
description = "Transfer Learning Library for Fault Diagnosis"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "Jinyuan Zhang", email = "feaxure@outlook.com"}
]
keywords = ["transfer-learning", "fault-diagnosis", "domain-adaptation", "machine-learning"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "torch>=1.10.0",
    "numpy>=1.21.2",
    "pandas>=1.5.3",
    "scipy>=1.10.0",
    "tqdm>=4.46.1",
    "matplotlib>=3.7.0",
    "scikit-learn>=1.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=22.0.0",
    "flake8>=4.0.0",
]

[tool.setuptools]
packages = ["models", "data_loader"]

[tool.black]
line-length = 100
target-version = ["py38", "py39", "py310"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]